# Add this inside your Apache <VirtualHost> or httpd.conf
# Requires: mod_proxy and mod_proxy_http enabled

ProxyPass /app http://localhost:8000/app
ProxyPassReverse /app http://localhost:8000/app
ProxyPass /api http://localhost:8000/api
ProxyPassReverse /api http://localhost:8000/api
ProxyPass /uploads http://localhost:8000/uploads
ProxyPassReverse /uploads http://localhost:8000/uploads
